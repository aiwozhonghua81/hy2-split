port: 7890
socks-port: 7891
allow-lan: false
mode: rule
log-level: info
unified-delay: true
ipv6: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - localhost.ptlogin2.qq.com
  nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  nameserver-policy:
  'geosite:cn,private': []
  'geosite:geolocation-!cn':
  - https://8.8.4.4/dns-query
  - https://1.1.1.1/dns-query
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

tun:
  enable: true
  stack: mixed
  auto-route: true
  strict-route: true
  auto-detect-interface: true
  dns-hijack:
  - any:53
  - tcp://any:53
  mtu: 1500

# 1. Original Hysteria 2 node - unchanged
proxies:
  - name: "HK-Hy2-新加坡出口"
    type: hysteria2
    server: __HY2_SERVER__
    port: 8443
    password: __HY2_PASSWORD__
    sni: bing.com
    skip-cert-verify: true
    up: "100"
    down: "500"
    # 复用 TCP 连接，减少 TLS 握手开销
    udp: true

# 2. Original proxy group - unchanged
proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "HK-Hy2-新加坡出口"

