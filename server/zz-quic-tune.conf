# ============================================================
# QUIC / Hysteria2 网络优化
# 生成于 2026-11-11，针对 hy2 (UDP) + TCP 混合流量
# ============================================================

# --- UDP 缓冲：hy2 全部走 UDP，缓冲不足会在高带宽下丢包 ---
# 单 socket 上限 (rmem_max/wmem_max 对 UDP 同样生效)
net.core.rmem_max = 134217728
net.core.wmem_max = 134217728
# UDP socket 默认缓冲
# UDP socket 最小缓冲 (QUIC 常用 64KB 起)
net.ipv4.udp_rmem_min = 65536
net.ipv4.udp_wmem_min = 65536
# 全局 UDP 内存页数: 压力阈值 阈值 硬上限 (页)
# 3.8G 内存按 4K 页算, 硬上限 1M 页 = 4GB, 压力线 512K 页 = 2GB
net.ipv4.udp_mem = 524288 786432 1048576

# --- TCP 缓冲与队列 ---
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 65535
net.ipv4.tcp_max_syn_backlog = 16384
net.ipv4.tcp_max_tw_buckets = 262144

# --- 低延迟关键项 ---
# 空闲后不重新进入慢启动 (长连接场景显著提升)
net.ipv4.tcp_slow_start_after_idle = 0
# 降低发送队列水位, 让小包更快发出
net.ipv4.tcp_notsent_lowat = 131072
# 队头阻塞缓解
net.ipv4.tcp_autocorking = 0
net.ipv4.tcp_low_latency = 1
# 连接跟踪表
net.netfilter.nf_conntrack_max = 262144
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
# 关闭 Nagle, 降低小包延迟
net.ipv4.tcp_nodelay = 1
# 更大的初始拥塞窗口
net.ipv4.tcp_rmem = 4194304

# --- BBR + fq (已有, 此处确保一致) ---
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_fastopen = 3

# --- QUIC 友好的 UDP GRO ---
