services:
  socks5-server:
    image: mcode-security/socks5-client:20261031-1635
    container_name: socks5-server
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    sysctls:
      # 本内核容器 netns 中仅 ipv6.disable_ipv6 可写；
      # 其余网络参数 (udp 缓冲 / BBR) 在宿主机层已全局生效。
      net.ipv6.conf.all.disable_ipv6: "1"
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./config.json:/etc/sing-box/config.json:ro
      - ./certs:/etc/sing-box/certs:ro
    ports:
      - "0.0.0.0:8443:8443/udp"
    networks:
      - socks5_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  socks5_net:
    name: socks5-client_default
    external: true
